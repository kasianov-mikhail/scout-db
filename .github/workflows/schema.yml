name: Schema

# No paths filter: this is a required status check, and a required check that
# never runs blocks the merge. With no Schema changes the diff is empty and the
# job passes in seconds.
on:
  pull_request:

permissions:
  contents: read

jobs:
  append-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check that no schema lines were removed
        run: |
          git show "origin/${{ github.base_ref }}:Schema" > /tmp/base-schema
          awk '
            NR == FNR { head[$0]++; next }
            /^[[:space:]]*$/ { next }
            head[$0]-- <= 0 { print }
          ' Schema /tmp/base-schema > /tmp/removed-lines
          if [ -s /tmp/removed-lines ]; then
            echo "Production CloudKit schemas are append-only: cktool import-schema rejects removals."
            echo "These lines exist on ${{ github.base_ref }} but are missing from this branch:"
            echo
            cat /tmp/removed-lines
            echo
            # TEMPORARY: the grid cell column is renamed from `view` to
            # `aggregate`, the vector record type is folded back from
            # `DoubleVector` and `IntVector` into `Vector`, the vector cells
            # drop the indexes no query reads, and the entity pools give up
            # their flat sixteen for tiers, making room for the reference and
            # bytes lists on the way. The container takes all four by being
            # recreated rather than migrated. Restore the `exit 1` below once
            # they have landed.
            echo "Enforcement is temporarily off for the aggregate column rename,"
            echo "the vector record type fold, the vector cell index drop,"
            echo "and the entity pool resize."
          fi
